name: Quellen prüfen

# Manuell starten: Prüft Arbeitsagentur, Arbeitnow, Telegram-Erreichbarkeit und alle
# Firmen aus firmen.yaml. Optional auch Indeed/LinkedIn und die Kandidatenliste.
# Ergebnis: Zusammenfassung des Laufs + Datei tools/pruefbericht.md
on:
  workflow_dispatch:
    inputs:
      jobspy:
        description: "Auch Indeed/LinkedIn testen"
        type: boolean
        default: false
      kandidaten:
        description: "Kandidaten-Firmen (tools/firmen_kandidaten.yaml) automatisch prüfen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-alarm
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prüfen
        env:
          JOBSPY: ${{ inputs.jobspy }}
          KANDIDATEN: ${{ inputs.kandidaten }}
        run: |
          ARGS=""
          if [ "$JOBSPY" = "true" ]; then ARGS="$ARGS --jobspy"; fi
          if [ "$KANDIDATEN" = "true" ]; then ARGS="$ARGS --kandidaten"; fi
          python -m tools.check_sources $ARGS
      - name: Bericht speichern
        if: always()
        run: |
          git config user.name "job-alarm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/pruefbericht.md tools/kandidaten_ergebnis.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Prüfbericht aktualisiert [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
