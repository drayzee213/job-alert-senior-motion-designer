name: Untersuchen (temporär)
on:
  workflow_dispatch:
  push:
    paths: ["tools/untersuchen.py"]
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m tools.untersuchen
      - name: Speichern
        if: always()
        run: |
          git config user.name "job-alarm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/untersuchung.md || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Untersuchung [skip ci]"
          git pull -q --rebase origin main && git push -q origin HEAD:main
