name: Job-Alarm

on:
  schedule:
    # Zeiten in UTC. 5–21 Uhr UTC deckt 7–22 Uhr Berlin im Sommer und Winter ab;
    # das genaue Zeitfenster prüft der Bot selbst (config.yaml -> benachrichtigung).
    # Krumme Minuten, weil zur vollen Stunde viele Läufe warten.
    # ACHTUNG: GitHub führt Zeitpläne oft stark verspätet oder gar nicht aus. Zuverlässig
    # wird es mit dem externen Auslöser cron-job.org (siehe README). Dieser Zeitplan ist
    # dann nur noch die Reserve; doppelte Abfragen verhindert der Bot selbst.
    - cron: "17,47 5-21 * * *"
  workflow_dispatch:
    inputs:
      uebersicht:
        description: "Alle aktuell passenden Stellen nach Relevanz schicken (wie /alle)"
        type: boolean
        default: false
      aktuelle_senden:
        description: "Passende Anzeigen der letzten 7 Tage einmal schicken"
        type: boolean
        default: false
      trockenlauf:
        description: "Trockenlauf (nichts senden, nichts speichern)"
        type: boolean
        default: false
      zeitplan:
        description: "Nur für den automatischen Auslöser (cron-job.org) – nicht ankreuzen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-alarm
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_KI: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: KI-Paket installieren (nur wenn ANTHROPIC_API_KEY gesetzt ist)
        if: env.HAS_KI == 'true'
        run: pip install "anthropic>=1,<2"

      - name: Job-Alarm ausführen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AKTUELLE: ${{ inputs.aktuelle_senden }}
          TROCKEN: ${{ inputs.trockenlauf }}
          ZEITPLAN: ${{ inputs.zeitplan }}
          UEBERSICHT: ${{ inputs.uebersicht }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS=""
          if [ "$EVENT" = "schedule" ] || [ "$ZEITPLAN" = "true" ]; then
            ARGS="$ARGS --min-abstand 20"   # automatischer Lauf: Zeitfenster beachten
          else
            ARGS="$ARGS --force"            # von Hand gestartet: sofort laufen
          fi
          if [ "$AKTUELLE" = "true" ]; then ARGS="$ARGS --recent-days 7"; fi
          if [ "$TROCKEN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$UEBERSICHT" = "true" ]; then ARGS="$ARGS --uebersicht"; fi
          python -m jobalarm.main $ARGS

      - name: Stand speichern (state/)
        if: always() && inputs.trockenlauf != true
        run: |
          git config user.name "job-alarm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -q -m "Stand aktualisiert [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "Push fehlgeschlagen" && exit 1
